services:
  server:
    build:
      # T12.3：上下文为仓库根（容器 /app 与仓库根同构，见 server/Dockerfile）
      context: .
      dockerfile: server/Dockerfile
    environment:
      - PLATFORM_SECRET=${PLATFORM_SECRET:-dev-secret-change-me}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-25}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-0}
      - SMTP_FROM=${SMTP_FROM:-}
      - DATA_DIR=/data
    ports:
      - "8081:8081"
    volumes:
      - server-data:/data
    restart: unless-stopped

  # T12.3：MCP Server（FastMCP streamable-http，同镜像不同入口）。
  # 工具经 compose 网络回环调 server（服务名解析）；生产由 Nginx /mcp 反代
  # 本服务 8082（HTTPS 硬前置，T12.5）。
  # T12.4：挂同一数据卷——上传审计日志落 /data/logs/mcp-ops.jsonl。
  mcp:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["python", "server/mcp_server.py"]
    environment:
      - PPP_API_BASE=http://server:8081
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8082
      - DATA_DIR=/data
      # base64 大参数上传（SDK 默认 4MiB 不够用，见 docs/poc-report-mcp-upload.md）
      - MCP_MAX_REQUEST_BODY_BYTES=167772160
      # download_prototype 生成下载直链用的平台基址：留空则按 MCP 请求的
      # scheme+Host 推导（Nginx 同域反代时即平台域名）；独立域名/端口时显式填
      - PLATFORM_PUBLIC_ORIGIN=${PLATFORM_PUBLIC_ORIGIN:-}
    ports:
      - "8082:8082"
    volumes:
      - server-data:/data
    depends_on:
      - server
    restart: unless-stopped

volumes:
  server-data:
