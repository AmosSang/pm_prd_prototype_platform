<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>账号设置 · 演示原型（带弹窗）</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #333; }
    .page { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
    h2 { font-size: 18px; }
    .row { background: #fff; border-radius: 8px; padding: 16px 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .row h3 { margin: 0; font-size: 15px; }
    .row p { margin: 4px 0 0; font-size: 12px; color: #999; }
    .btn { padding: 6px 16px; border: 1px solid #d9d9d9; border-radius: 4px; background: #fff; cursor: pointer; font-size: 13px; }
    .btn.danger { color: #d33; border-color: #d33; }
    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; }
    .modal-mask.open { display: flex; }
    .modal { background: #fff; border-radius: 8px; width: 320px; padding: 24px; }
    .modal h3 { margin: 0 0 8px; font-size: 16px; }
    .modal p { font-size: 13px; color: #666; margin: 0 0 20px; }
    .modal-actions { display: flex; gap: 12px; }
    .modal-actions .btn { flex: 1; }
    .btn.primary { background: #d33; color: #fff; border-color: #d33; }
  </style>
</head>
<body>
  <!-- fixture：带弹窗交互的设置页（POC 场景二：交互状态保留验证） -->
  <main class="page" data-pa="page-settings">
    <h2>账号设置</h2>
    <div class="row" data-pa="settings-profile">
      <div><h3>个人资料</h3><p>头像、昵称、简介</p></div>
      <button class="btn" data-pa="settings-profile-edit">编辑</button>
    </div>
    <div class="row" data-pa="settings-password">
      <div><h3>登录密码</h3><p>每 90 天建议更换</p></div>
      <button class="btn" data-pa="settings-password-edit">修改</button>
    </div>
    <div class="row" data-pa="settings-deregister">
      <div><h3>注销账号</h3><p>账号删除后数据不可恢复</p></div>
      <button class="btn danger" id="open-modal" data-pa="settings-deregister-btn">注销账号</button>
    </div>
  </main>
  <div class="modal-mask" id="modal-mask" data-pa="deregister-modal">
    <div class="modal" role="dialog" aria-modal="true">
      <h3>确认注销账号？</h3>
      <p>注销后所有数据将在 7 天内永久删除，此操作不可恢复。</p>
      <div class="modal-actions">
        <button class="btn" id="cancel" data-pa="deregister-cancel">再想想</button>
        <button class="btn primary" id="confirm-delete" data-pa="deregister-confirm">确认注销</button>
      </div>
    </div>
  </div>
  <script>
    document.getElementById('open-modal').addEventListener('click', function () {
      document.getElementById('modal-mask').classList.add('open')
    })
    document.getElementById('cancel').addEventListener('click', function () {
      document.getElementById('modal-mask').classList.remove('open')
    })
  </script>
</body>
</html>
