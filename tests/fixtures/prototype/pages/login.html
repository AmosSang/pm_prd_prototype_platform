<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>登录页 · 演示原型</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f5f6f8; }
    .card { background: #fff; padding: 32px 40px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.08); width: 320px; }
    h2 { margin: 0 0 20px; font-size: 18px; }
    label { display: block; font-size: 13px; color: #666; margin: 12px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #d9d9d9; border-radius: 4px; }
    button { width: 100%; margin-top: 20px; padding: 10px; background: #2b5cff; color: #fff; border: 0; border-radius: 4px; font-size: 14px; }
  </style>
</head>
<body>
  <!-- fixture：带 data-pa 锚点的演示登录页（契约测试与 E2E 共用） -->
  <main class="card" data-pa="page-login">
    <h2>账号登录</h2>
    <form id="login-form" data-pa="login-form">
      <div class="form-group">
        <label for="account">手机号 / 邮箱</label>
        <input id="account" name="account" data-pa="login-account" type="text" placeholder="请输入手机号或邮箱">
      </div>
      <div class="form-group">
        <label for="captcha">验证码</label>
        <input id="captcha" name="captcha" data-pa="login-captcha" type="text" placeholder="6 位数字验证码">
      </div>
      <button type="submit" data-pa="login-submit">登 录</button>
    </form>
  </main>
</body>
</html>
